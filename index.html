
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iguersafene - Portail Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --village-green: #10b981;
            --village-blue: #3b82f6;
            --village-yellow: #facc15;
            --village-red: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        h1, h2, h3, .font-display {
            font-family: 'Playfair+Display', serif;
        }
        .bg-village-green { background-color: var(--village-green); }
        .text-village-green { color: var(--village-green); }
        .border-village-green { border-color: var(--village-green); }
        
        .bg-village-blue { background-color: var(--village-blue); }
        .text-village-blue { color: var(--village-blue); }
        .border-village-blue { border-color: var(--village-blue); }
        
        .bg-village-yellow { background-color: var(--village-yellow); }
        .text-village-yellow { color: var(--village-yellow); }
        .border-village-yellow { border-color: var(--village-yellow); }
        
        .bg-village-red { background-color: var(--village-red); }
        .text-village-red { color: var(--village-red); }
        .border-village-red { border-color: var(--village-red); }

        .btn-primary {
            background-color: var(--village-green);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
    </style>
<script type="importmap">

    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
